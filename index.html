<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalender</title>

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalender">
  <meta name="format-detection" content="telephone=no">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="title"></h1>
      <div class="actions">
        <button id="btn-add" class="round-btn" aria-label="Hinzufügen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div id="nav" class="nav">
      <button id="btn-prev" class="nav-btn" aria-label="Vorheriger Monat">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="btn-today" class="text-btn" hidden>Heute</button>
      <button id="btn-next" class="nav-btn" aria-label="Nächster Monat">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <main id="view"></main>

    <nav id="tabbar" aria-label="Ansicht">
      <button data-view="month" aria-label="Monat">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Monat</span>
      </button>
      <button data-view="week" aria-label="Woche">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16.5" rx="3.5"/><path d="M9.2 4v16.5M14.8 4v16.5"/></svg>
        <span>Woche</span>
      </button>
      <button data-view="year" aria-label="Jahr">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <span>Jahr</span>
      </button>
      <button data-view="birthdays" aria-label="Geburtstage">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5h16M5.5 20.5v-6.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6.5M5.5 16c2 1.6 3.4 1.6 4.2 0 1 1.6 3.3 1.6 4.3 0 .9 1.6 2.4 1.6 4.5 0M12 11.8V8.5M12 6.2c.9-.9.9-1.7 0-2.7-.9 1-.9 1.8 0 2.7z"/></svg>
        <span>Geburtstage</span>
      </button>
    </nav>
  </div>

  <div id="banners" aria-live="polite"></div>
  <div id="overlay"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
